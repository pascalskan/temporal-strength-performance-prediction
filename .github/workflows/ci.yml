name: Python CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      # Matches the interpreter the experiments are executed on. Validating on
      # a different minor version than the results were produced with means CI
      # is not checking the code that generated them.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check compilation
        run: |
          python -m compileall src main.py scripts

      - name: Run tests
        run: |
          pytest

      - name: Import smoke test
        run: |
          python -c "import src.analysis; import src.config; import src.contracts; import src.core; import src.data; import src.evaluation; import src.features; import src.io; import src.models; import src.pipelines; import src.reproducibility; import src.utils; print('Core library imports OK')"

      # Executes every evaluation protocol end to end against the committed
      # deterministic fixture. The unit suite passed continuously while four
      # separate defects left whole pipelines unable to run: an absent equipment
      # class, a feature-engineering default naming a column nothing creates, a
      # stale call signature, and results written to a colliding path. None were
      # reachable from unit tests; all would have failed here on first push.
      - name: Run every protocol end to end on the test fixture
        run: |
          python main.py --test

      - name: Verify each protocol produced its expected outputs
        run: |
          python scripts/verify_fixture_outputs.py
